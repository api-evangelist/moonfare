name: Moonfare
description: Moonfare is a digital investment platform that gives individual professional
  and high-net-worth investors access to private equity and venture capital funds
  that were historically reserved for institutions. The platform pools investor commitments
  into Luxembourg-based feeder funds, applies rigorous due diligence (approving only
  a small fraction of screened funds), and offers products spanning direct fund investments,
  portfolio-of-funds, co-investments, secondaries, and open-ended funds, with a digital
  secondary market for institutional-style liquidity. Moonfare handles capital calls,
  distributions, reporting, and administration through a technology-enabled onboarding
  and portfolio experience. Moonfare does not currently publish a public developer
  API or developer portal.
